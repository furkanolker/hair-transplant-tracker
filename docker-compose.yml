services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hair_tracker
      POSTGRES_USER: hair_user
      POSTGRES_PASSWORD: hair_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hair_user -d hair_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hair_user}:${POSTGRES_PASSWORD:-hair_pass}@postgres:5432/${POSTGRES_DB:-hair_tracker}
      SECRET_KEY: ${SECRET_KEY:-change-me}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hair_user}:${POSTGRES_PASSWORD:-hair_pass}@postgres:5432/${POSTGRES_DB:-hair_tracker}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
